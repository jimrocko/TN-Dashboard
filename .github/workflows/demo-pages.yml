# Veröffentlicht die Demo (App mit erfundenen Daten, ohne Server) auf GitHub Pages:
#   https://jimrocko.github.io/TN-Dashboard/
# Läuft bei jedem Push auf den Standard-Branch oder per Hand (Actions → Demo auf GitHub Pages → Run workflow).
# Einmalig nötig: Repo öffentlich und unter Settings → Pages bei „Source“ „GitHub Actions“ wählen.
name: Demo auf GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Demo bauen
        working-directory: frontend
        run: npm ci && npm run build:demo

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp docs/demo/tn-dashboard-demo.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
